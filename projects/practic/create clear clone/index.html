<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Управление элементами</title>
    <style>
        /* Стили для кнопок */
        
        button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 16px;
        }
        /* Стили для контейнера элементов */
        
        #container {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        /* Общий стиль для элементов */
        
        .box {
            width: 100px;
            height: 100px;
            background-color: #4CAF50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
            cursor: default;
        }
    </style>
</head>

<body>

    <h1>Управление элементами</h1>
    <!-- Кнопки управления -->
    <button id="addBtn">Добавить элемент</button>
    <button id="removeBtn">Удалить элемент</button>
    <button id="cloneBtn">Клонировать элемент</button>

    <!-- Контейнер для элементов -->
    <div id="container"></div>

    <script>
        const container = document.getElementById('container');
        const addBtn = document.getElementById('addBtn');
        const removeBtn = document.getElementById('removeBtn');
        const cloneBtn = document.getElementById('cloneBtn');

        let count = 0; // счетчик элементов

        // Функция для добавления нового элемента
        addBtn.addEventListener('click', () => {
            count++;
            const div = document.createElement('div');
            div.className = 'box';
            div.textContent = count;
            container.appendChild(div);
        });

        // Функция для удаления последнего элемента
        removeBtn.addEventListener('click', () => {
            if (container.lastElementChild) {
                container.removeChild(container.lastElementChild);
                count--;
            }
        });

        // Функция для клонирования последнего элемента
        cloneBtn.addEventListener('click', () => {
            const lastBox = container.lastElementChild;
            if (lastBox) {
                const clone = lastBox.cloneNode(true);
                count++;
                clone.textContent = count; // обновляем номер
                container.appendChild(clone);
            }
        });
    </script>

</body>

</html>
